[build]
  command = "npm run build"
  publish = "dist"

# API Proxy Rewrite: Routes /api requests to backend service
[[redirects]]
  from = "/api/*"
  to = "https://placement-readiness-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
